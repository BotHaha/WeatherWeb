<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <title>登入帳號</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <form class="login-box" method="post" action="/login">
            
            <input type="hidden" name="next" value="{{ next_page if next_page else '' }}">
            
            <h2>Login</h2>
            
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter Username" required>
            
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter Password" required>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <input type="submit" class="submit" value="登入" style="flex: 1;">
                
                <a href="{{ url_for('dashboard', username=username) }}" style="text-decoration: none; flex: 1;">
                    <input type="button" class="submit" value="返回" style="width: 100%;">
                </a>
                
            </div>
        </form>
    </div>
</body>
</html>
